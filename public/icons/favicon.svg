  <path d="M20 28 Q32 14 44 28" stroke="#F5A321" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Cuerpo de la canasta -->
  <path d="M14 28 Q13 44 18 48 Q32 52 46 48 Q51 44 50 28 Z" fill="#F5A321"/>
  <!-- Tejido / líneas horizontales -->
  <line x1="14" y1="34" x2="50" y2="34" stroke="#1B6B3A" stroke-width="1.5" opacity="0.4"/>
  <line x1="13" y1="40" x2="51" y2="40" stroke="#1B6B3A" stroke-width="1.5" opacity="0.4"/>
  <!-- Tejido / líneas verticales -->
  <line x1="22" y1="28" x2="20" y2="49" stroke="#1B6B3A" stroke-width="1.5" opacity="0.4"/>
  <line x1="29" y1="28" x2="29" y2="51" stroke="#1B6B3A" stroke-width="1.5" opacity="0.4"/>
  <line x1="36" y1="28" x2="36" y2="51" stroke="#1B6B3A" stroke-width="1.5" opacity="0.4"/>
  <line x1="43" y1="28" x2="41" y2="49" stroke="#1B6B3A" stroke-width="1.5" opacity="0.4"/>
  <!-- Producto: tomate -->
  <circle cx="25" cy="24" r="4.5" fill="#E53935"/>
  <path d="M25 19.5 Q26 17 27 19" stroke="#2E7D32" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Producto: hoja/vegetal -->
  <ellipse cx="39" cy="23" rx="4" ry="5" fill="#43A047" transform="rotate(-15 39 23)"/>
  <line x1="39" y1="19" x2="39" y2="27" stroke="#1B6B3A" stroke-width="1" opacity="0.6"/>
</svg>
